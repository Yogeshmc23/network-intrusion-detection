<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <script>
      try {
        const savedTheme = localStorage.getItem('cybershield_theme');
        if (savedTheme === 'light' || savedTheme === 'dark') {
          document.documentElement.classList.toggle('light', savedTheme === 'light');
          document.documentElement.classList.toggle('dark', savedTheme === 'dark');
        }
      } catch (_) { /* default to the dark theme when storage is unavailable */ }
    </script>
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%2306b6d4' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'><path d='M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z'/></svg>" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CyberShield IDS | Intrusion Detection Platform</title>
  </head>
  <body class="bg-slate-950 text-slate-100 antialiased selection:bg-cyan-500/30 selection:text-cyan-200 min-h-screen">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
